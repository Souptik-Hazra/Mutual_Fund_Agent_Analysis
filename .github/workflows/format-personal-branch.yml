name: Format personal research branch

on:
  push:
    branches:
      - feat/phases-9-11-personal-research

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phases-9-11-personal-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Format Python files
        run: ruff format .
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "Format personal research implementation"
          git push origin HEAD:feat/phases-9-11-personal-research
