name: Temporary branch formatter

on:
  push:
    branches:
      - feat/phases-5-8-intelligence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phases-5-8-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Format repository
        run: ruff format .
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:feat/phases-5-8-intelligence
