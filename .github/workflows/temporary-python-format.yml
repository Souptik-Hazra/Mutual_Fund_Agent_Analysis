name: Temporary Python formatter
on:
  push:
    branches:
      - feat/phases-13-16-intelligence
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phases-13-16-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Apply Ruff fixes and formatting
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.py'
          if ! git diff --cached --quiet; then
            git commit -m "style: format phases 13-16 implementation"
            git push origin HEAD:feat/phases-13-16-intelligence
          fi
