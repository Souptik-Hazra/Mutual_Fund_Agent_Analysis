name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mfa
          POSTGRES_PASSWORD: mfa_test_password
          POSTGRES_DB: mfa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfa -d mfa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mfa:mfa_test_password@localhost:5432/mfa_test
      QDRANT_TEST_URL: http://localhost:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Python dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable --strict
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Validate local backup and restore scripts
        run: bash -n scripts/backup-local.sh scripts/restore-local.sh scripts/test-backup-restore-drill.sh
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --tag mutual-fund-agent-analysis:ci .
      - name: Run backend tests
        run: pytest --cov=mutual_fund_agent_analysis --cov-report=term-missing
      - name: Run offline agent evaluation
        run: mfa-evaluate-agent

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated PostgreSQL and Qdrant recovery drill
        run: ./scripts/test-backup-restore-drill.sh
