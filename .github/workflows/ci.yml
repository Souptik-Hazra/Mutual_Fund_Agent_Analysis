name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mfa
          POSTGRES_PASSWORD: mfa_test_password
          POSTGRES_DB: mfa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfa -d mfa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mfa:mfa_test_password@localhost:5432/mfa_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --tag mutual-fund-agent-analysis:ci .
      - name: Run tests
        run: pytest --cov=mutual_fund_agent_analysis --cov-report=term-missing
