[build-system]
requires = ["hatchling>=1.26", "setuptools>=84.1.0"]
build-backend = "hatchling.build"

[project]
name = "mutual-fund-agent-analysis"
version = "0.1.0"
description = "AI-assisted mutual fund research and market intelligence platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1.5.2,<2",
  "langchain-core>=1.8.4,<2",
  "langgraph>=1.2.24,<2",
  "langchain-google-genai>=4.5.2,<5",
  "langchain-groq>=1.2.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pymupdf>=1.25,<2",
  "openpyxl>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
mfa-sync-nav = "mutual_fund_agent_analysis.cli.sync_nav:main"
mfa-sync-catalogue = "mutual_fund_agent_analysis.cli.sync_catalogue:main"
mfa-sync-scheme-metadata = "mutual_fund_agent_analysis.cli.sync_scheme_metadata:main"
mfa-sync-benchmark = "mutual_fund_agent_analysis.cli.sync_benchmark:main"
mfa-purge-expired-social = "mutual_fund_agent_analysis.cli.purge_social:main"
mfa-evaluate-agent = "mutual_fund_agent_analysis.cli.evaluate_agent:main"
mfa-audit-local = "mutual_fund_agent_analysis.cli.audit_local:main"
mfa-import-scheme-metadata = "mutual_fund_agent_analysis.cli.import_financial_csv:import_scheme_metadata_main"
mfa-import-idcw = "mutual_fund_agent_analysis.cli.import_financial_csv:import_idcw_distributions_main"
mfa-register-source = "mutual_fund_agent_analysis.cli.register_source:main"

[project.optional-dependencies]
openai = ["langchain-openai>=1.8.3,<2"]
vectors = ["langchain-qdrant>=1.2.0,<2", "qdrant-client>=1.13,<2"]
ocr = ["pytesseract>=0.3.13,<1", "Pillow>=11,<13"]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=7.0.0,<8", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mutual_fund_agent_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
