services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mutual_fund_agent
      POSTGRES_USER: mfa
      POSTGRES_PASSWORD: mfa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfa -d mutual_fund_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://mfa:mfa_dev_password@db:5432/mutual_fund_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
